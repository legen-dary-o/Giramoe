<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Giramoe — Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Pre-game -->
  <div id="admin-pregame" class="screen">
    <div class="mobile-container">
      <img src="/assets/logo.png" alt="Giramoe" style="width: 120px; margin-bottom: 16px;">
      <h1 style="font-size: 22px; font-weight: 700; margin-bottom: 24px;">Game Master</h1>
      <button class="glass-button" id="btn-inizia">Inizia</button>
    </div>
  </div>

  <!-- Lobby -->
  <div id="admin-lobby" class="screen hidden">
    <div class="admin-container">
      <h1>Giramoe</h1>
      <div class="admin-section">
        <h2>Giocatori</h2>
        <div class="admin-player-list" id="admin-players"></div>
      </div>
      <button class="glass-button" id="btn-avvia" disabled>Avvia partita</button>
    </div>
  </div>

  <!-- Game -->
  <div id="admin-game" class="screen hidden">
    <div class="admin-container">
      <h1>Giramoe</h1>
      <div class="admin-section">
        <h2 id="admin-board-counter">Tabellone</h2>
        <input type="text" id="cat-input" class="glass-input" placeholder="Categoria" autocomplete="off">
        <input type="text" id="phrase-input" class="glass-input" placeholder="Frase" autocomplete="off" style="margin-top:8px;">
        <button class="glass-button" id="btn-set-board" style="margin-top:8px;">Avvia tabellone</button>
        <div class="board-error" id="board-error"></div>
      </div>
      <div class="admin-section">
        <h2>Turno: <span id="admin-turn-name">—</span> <span id="admin-turn-state" class="turn-state-tag"></span></h2>
        <div class="admin-player-list" id="admin-scores"></div>
      </div>
      <div class="admin-section admin-actions">
        <button class="glass-button" id="btn-solve">Frase indovinata</button>
        <button class="glass-button" id="btn-pass">Passa turno</button>
      </div>
    </div>
  </div>

  <!-- Triplete: ready (button appears after the 3 wheel boards) -->
  <div id="admin-tripleteready" class="screen hidden">
    <div class="admin-container">
      <h1>Tabelloni finiti!</h1>
      <p style="margin-bottom: 22px; color: var(--ink-soft);">Pronti per il gioco finale.</p>
      <button class="glass-button" id="btn-go-triplete">IL TRIPLETE</button>
    </div>
  </div>

  <!-- Triplete: control -->
  <div id="admin-triplete" class="screen hidden">
    <div class="admin-container">
      <h1>IL TRIPLETE</h1>
      <div class="admin-section" id="triplete-setup">
        <h2>Argomento e 3 frasi</h2>
        <input type="text" id="tr-title" class="glass-input" placeholder="Titolo / argomento" autocomplete="off">
        <input type="text" id="tr-phrase-1" class="glass-input" placeholder="Frase 1" autocomplete="off" style="margin-top:8px;">
        <input type="text" id="tr-phrase-2" class="glass-input" placeholder="Frase 2" autocomplete="off" style="margin-top:8px;">
        <input type="text" id="tr-phrase-3" class="glass-input" placeholder="Frase 3" autocomplete="off" style="margin-top:8px;">
        <button class="glass-button" id="btn-triplete-start" style="margin-top:10px;">Avvia il Triplete</button>
        <div class="board-error" id="triplete-error"></div>
      </div>
      <div class="admin-section hidden" id="triplete-live">
        <h2 id="triplete-board-counter">Tabellone 1 / 3</h2>
        <div class="admin-player-list" id="triplete-scores"></div>
      </div>
      <div class="admin-section admin-actions hidden" id="triplete-actions">
        <button class="glass-button" id="btn-triplete-correct" disabled>Frase indovinata</button>
        <button class="glass-button" id="btn-triplete-wrong" disabled>Frase sbagliata</button>
      </div>
    </div>
  </div>

  <!-- Match End -->
  <div id="admin-matchend" class="screen hidden">
    <div class="admin-container">
      <h1>Fine partita</h1>
      <div class="admin-player-list" id="admin-standings"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
