<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giramoe</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/qrcode.min.js"></script>
</head>
<body>
  <!-- Tap-to-start (unlocks audio, plays the intro video with sound) -->
  <div id="start-tap-screen" class="screen">
    <div class="mobile-container">
      <img src="/assets/logo.png" alt="Giramoe" style="width: 220px; margin-bottom: 28px;">
      <button class="glass-button" id="tap-start-btn">Tocca per iniziare</button>
    </div>
  </div>

  <!-- Video Screen -->
  <div id="video-screen" class="screen hidden">
    <video id="intro-video" playsinline>
      <source src="/assets/trailer.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Start Button Screen -->
  <div id="start-screen" class="screen hidden">
    <button class="glass-button" id="start-btn" disabled>Inizia</button>
  </div>

  <!-- Lobby Screen -->
  <div id="lobby-screen" class="screen hidden">
    <div class="lobby-container">
      <img src="/assets/logo.png" alt="Giramoe" class="lobby-logo">
      <div class="qr-container glass-panel">
        <canvas id="qr-canvas"></canvas>
      </div>
      <p class="lobby-hint">Inquadra il QR per entrare in partita</p>
      <div class="player-slots" id="player-slots">
        <div class="player-slot" id="slot-0">—</div>
        <div class="player-slot" id="slot-1">—</div>
        <div class="player-slot" id="slot-2">—</div>
      </div>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" class="screen hidden">
    <div class="game-container">
      <div class="wheel-container" id="main-wheel-container">
        <div class="wheel-indicator" id="main-wheel-indicator" style="display: none;"></div>
        <canvas id="main-wheel-canvas"></canvas>
      </div>
      <div class="category-banner glass-panel" id="category-banner"></div>
      <div class="board-grid" id="board-grid"></div>
      <div class="players-bar" id="players-bar"></div>
    </div>

    <div class="result-overlay" id="result-overlay">
      <div class="result-text" id="result-text"></div>
    </div>
  </div>

  <!-- Triplete: title animation -->
  <div id="triplete-title-screen" class="screen hidden">
    <div class="triplete-stage">
      <div class="triplete-fan-wrap"><div class="triplete-fan"></div></div>
      <div class="triplete-plate">
        <div class="triplete-title" id="triplete-title"></div>
      </div>
    </div>
  </div>

  <!-- Triplete: board -->
  <div id="triplete-screen" class="screen hidden">
    <div class="game-container">
      <div class="triplete-tag glass-panel" id="triplete-board-tag">IL TRIPLETE</div>
      <div class="category-banner glass-panel" id="triplete-category"></div>
      <div class="board-grid" id="triplete-board-grid"></div>
      <div class="players-bar" id="triplete-players-bar"></div>
    </div>
    <div class="buzz-banner" id="buzz-banner"><span id="buzz-banner-text"></span></div>
    <div class="result-overlay" id="triplete-result-overlay">
      <div class="result-text" id="triplete-result-text"></div>
    </div>
  </div>

  <!-- Finalist Screen -->
  <div id="finalist-screen" class="screen hidden">
    <div class="game-container">
      <h1 class="matchend-title">Finalista</h1>
      <div class="finalist-name" id="finalist-name"></div>
      <p class="lobby-hint">va al gioco finale!</p>
    </div>
  </div>

  <!-- Final game -->
  <div id="final-screen" class="screen hidden">
    <div class="game-container">
      <div class="final-top">
        <div class="category-banner glass-panel" id="final-category"></div>
        <div class="final-timer glass-panel" id="final-timer">60</div>
      </div>
      <div class="triplete-tag glass-panel" id="final-board-tag">Tabellone 1/3</div>
      <div class="board-grid" id="final-board-grid"></div>
    </div>
  </div>

  <!-- Final results -->
  <div id="finaldone-screen" class="screen hidden">
    <div class="game-container">
      <h1 class="matchend-title">Fine!</h1>
      <div class="final-results" id="final-results"></div>
    </div>
  </div>

  <!-- Disconnect Overlay -->
  <div class="disconnect-overlay" id="disconnect-overlay">
    <p>In attesa di riconnessione...</p>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/audio.js"></script>
  <script src="/js/wheel.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
