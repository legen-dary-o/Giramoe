<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Giramoe — Player</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Join Form -->
  <div id="join-screen" class="screen">
    <div class="mobile-container">
      <div class="wm phone-wm">GIRAMOE</div>
      <div class="join-form">
        <input type="text" id="nick-input" class="glass-input" placeholder="Il tuo nome" maxlength="16" autocomplete="off">
        <button class="glass-button" id="btn-join">Entra</button>
      </div>
    </div>
  </div>

  <!-- Reconnecting -->
  <div id="reconnect-screen" class="screen hidden">
    <div class="mobile-container">
      <div class="wm phone-wm">GIRAMOE</div>
      <h2>Riconnessione…</h2>
    </div>
  </div>

  <!-- Waiting Lobby -->
  <div id="wait-screen" class="screen hidden">
    <div class="mobile-container">
      <h2>In attesa dell'inizio...</h2>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="player-game-screen" class="screen hidden">
    <div class="mobile-container">
      <div class="score-row">
        <span class="score-pill">Turno: <b id="round-points">0</b></span>
        <span class="score-pill">Banca: <b id="bank-points">0</b></span>
      </div>
      <div class="turn-message" id="turn-message">Attendi il tuo turno</div>
      <div class="wheel-container" id="player-wheel-container">
        <div class="wheel-indicator"></div>
        <canvas id="player-wheel-canvas"></canvas>
      </div>
      <button class="glass-button" id="btn-spin">Gira la ruota</button>
      <div class="keyboard" id="keyboard"></div>
      <button class="glass-button" id="btn-vowel" disabled>Compra vocale (500)</button>
      <div class="vowel-picker hidden" id="vowel-picker"></div>
      <div class="player-nick" id="player-nick-display"></div>
    </div>
  </div>

  <!-- Triplete -->
  <div id="player-triplete-screen" class="screen hidden">
    <div class="mobile-container">
      <div class="score-row">
        <span class="score-pill">Triplete: <b id="tr-points">0</b></span>
        <span class="score-pill" id="tr-board">Tabellone 1/3</span>
      </div>
      <div class="turn-message" id="tr-message">Prenotati appena sai la frase!</div>
      <button class="glass-button buzz-button" id="btn-buzz" disabled>PRENOTATI</button>
      <div class="player-nick" id="tr-nick"></div>
    </div>
  </div>

  <!-- Giramoe (final wheel board) -->
  <div id="player-giramoe-screen" class="screen hidden">
    <div class="mobile-container">
      <div class="score-row">
        <span class="score-pill">Punti: <b id="gi-points">0</b></span>
        <span class="score-pill" id="gi-mult">×—</span>
      </div>
      <div class="turn-message" id="gi-message">GIRAMOE</div>
      <div class="keyboard" id="gi-keyboard"></div>
      <button class="glass-button" id="btn-gi-vowel" disabled>Compra vocale (500)</button>
      <div class="vowel-picker hidden" id="gi-vowel-picker"></div>
      <button class="buzz-pill" id="btn-gi-buzz" disabled>PRENOTATI</button>
      <div class="player-nick" id="gi-nick"></div>
    </div>
  </div>

  <!-- Tie-break -->
  <div id="player-tiebreak-screen" class="screen hidden">
    <div class="mobile-container">
      <h2 class="matchend-title">Spareggio</h2>
      <div class="turn-message" id="tb-message">Spareggio in corso…</div>
      <button class="buzz-pill" id="btn-tb-spin" disabled>GIRA LA RUOTA</button>
    </div>
  </div>

  <!-- Finalist -->
  <div id="player-finalist-screen" class="screen hidden">
    <div class="mobile-container">
      <h2 class="matchend-title" id="player-finalist-title">—</h2>
    </div>
  </div>

  <!-- Final game (finalist only) -->
  <div id="player-final-screen" class="screen hidden">
    <div class="mobile-container">
      <div class="turn-message" id="final-message">Gioco finale</div>
      <div class="keyboard" id="final-keyboard"></div>
      <div class="vowel-picker" id="final-vowels"></div>
      <button class="buzz-pill" id="btn-final-buzz" disabled>PRENOTATI</button>
    </div>
  </div>

  <!-- Envelopes -->
  <div id="player-envelopes-screen" class="screen hidden">
    <div class="mobile-container">
      <div class="turn-message" id="env-message">Le buste</div>
      <div class="envelopes-row" id="player-envelopes-row"></div>
      <div class="env-actions">
        <button class="buzz-pill" id="btn-env-keep" style="display:none;">TIENI</button>
        <button class="buzz-pill" id="btn-env-change" style="display:none;">CAMBIA</button>
      </div>
    </div>
  </div>

  <!-- Disconnect Overlay -->
  <div class="disconnect-overlay" id="disconnect-overlay">
    <p>In attesa di riconnessione...</p>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <!-- Gli script della pagina vengono caricati da qui, in ordine, invece che con
       quattro tag: in sviluppo `?mock=` deve installare la socket finta PRIMA di
       player.js, e un modulo con top-level await NON blocca gli script `defer`
       (player.js partirebbe prima e prenderebbe la socket vera). Un solo
       percorso per entrambi i casi, così non c'è un ordine che vale solo in dev. -->
  <script type="module">
    let mock = null;
    if (new URLSearchParams(location.search).has('mock')) {
      const { installMock } = await import('/js/dev/mock.js');
      mock = await installMock('phone', { autoStart: false });
    }
    for (const src of ['/js/wheel.js', '/js/player.js', '/js/samiro-faq.js', '/js/samiro.js']) {
      await new Promise((ok, ko) => {
        const s = document.createElement('script');
        s.src = src; s.onload = ok; s.onerror = () => ko(new Error('script non caricato: ' + src));
        document.head.appendChild(s);
      });
    }
    // solo ora gli handler sono registrati
    if (mock) await mock.start();
  </script>
</body>
</html>
